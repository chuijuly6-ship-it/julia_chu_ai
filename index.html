<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Юлия Чуйкина: AI-креатор. Реклама, фото и видео для брендов и малого бизнеса."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>Юлия Чуйкина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFF5F3; --bg2:#FBE6E5; --bg3:#F7D6DB;
  --surface:#FFFFFF; --glass:rgba(255,255,255,.72);
  --ink:#3A2A2F; --muted:#86696F;
  --accent:#C7526E; --accent-ink:#FFFFFF; --accent-soft:#F8D7DD;
  --line:#F0D5D6; --bar:rgba(255,245,243,.84);
  --shadow:0 14px 36px rgba(199,82,110,.11);
  --blob1:#F8BAC4; --blob2:#FBD5C5;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --gutter:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1618; --bg2:#2A1D20; --bg3:#3A262B;
    --surface:#2F2124; --glass:rgba(47,33,36,.72);
    --ink:#FBEDEE; --muted:#C9A9AF;
    --accent:#F08FA5; --accent-ink:#2B1015; --accent-soft:#4A2E35;
    --line:#48333A; --bar:rgba(31,22,24,.84);
    --shadow:0 14px 36px rgba(0,0,0,.35);
    --blob1:#7A3646; --blob2:#6B4438;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1618; --bg2:#2A1D20; --bg3:#3A262B;
  --surface:#2F2124; --glass:rgba(47,33,36,.72);
  --ink:#FBEDEE; --muted:#C9A9AF;
  --accent:#F08FA5; --accent-ink:#2B1015; --accent-soft:#4A2E35;
  --line:#48333A; --bar:rgba(31,22,24,.84);
  --shadow:0 14px 36px rgba(0,0,0,.35);
  --blob1:#7A3646; --blob2:#6B4438;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--gutter)}
section{padding-block:clamp(56px,8vw,104px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1,h2,h3{font-weight:500;letter-spacing:-.025em;line-height:1.08;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,52px)}
.lead{color:var(--muted);max-width:60ch;margin:0}
.rv{transform:translateY(16px);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{transform:none}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;text-decoration:none;margin-right:auto}
.logo i{color:var(--accent);font-style:normal}
.nav{display:flex;gap:28px;font-size:14px;font-weight:500}
.nav a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover{color:var(--ink)}
.lang{display:flex;background:var(--bg2);border-radius:999px;padding:3px;font-size:12px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;border-radius:999px;color:var(--muted);letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:14px 24px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid transparent;transition:transform .25s,box-shadow .25s,background .25s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px rgba(199,82,110,.28)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(199,82,110,.34)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.sm{padding:10px 18px;font-size:14px}

/* hero */
.hero{position:relative;overflow-x:clip;padding-block:clamp(36px,6vw,72px) clamp(28px,4vw,48px)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(46px,7.4vw,92px);font-weight:400;letter-spacing:-.035em;line-height:1}
.hero h1 b{display:block;font-weight:500;color:var(--accent)}
.hero .role{font-size:clamp(17px,1.6vw,20px);font-weight:600;margin:26px 0 8px;max-width:30ch}
.hero p.sub{color:var(--muted);margin:0 0 30px;max-width:46ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.portrait{position:relative;width:100%;max-width:470px;aspect-ratio:1;margin-inline:auto}
.blob{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle at 65% 40%,var(--blob1),transparent 62%),radial-gradient(circle at 25% 75%,var(--blob2),transparent 60%);filter:blur(26px);opacity:.9;will-change:transform}
.portrait .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 24px 60px rgba(199,82,110,.22);background:var(--bg2)}
.portrait .ph img{width:100%;height:100%;object-fit:cover}
.avail{position:absolute;right:-6%;bottom:-4%;width:min(62%,290px);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.avail .st{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent)}
.avail .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.avail p{margin:8px 0 12px;font-size:14px;line-height:1.45}
.avail a{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;text-decoration:none;border-top:1px solid var(--line);padding-top:12px}
.circ{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:none;transition:background .25s,color .25s,border-color .25s}
.circ svg{width:14px;height:14px}
a:hover>.circ,.card:hover .circ{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* tools marquee */
.tools{padding-block:0}
.tools .row{display:flex;align-items:center;gap:22px;border-block:1px solid var(--line);padding-block:20px}
.tools .lab{font-size:13px;color:var(--muted);flex:none;font-weight:500}
.marq{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:34px;width:max-content;animation:mq 60s linear infinite}
.track span{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--muted);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}

/* stats */
.stats{padding-block:clamp(36px,5vw,56px) 0}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.stat{padding:26px 24px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:clamp(34px,4vw,48px);font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.4}

/* headings row */
.head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(28px,4vw,44px)}
.head .lead{margin-top:14px}

/* cards */
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{position:relative;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 46px rgba(199,82,110,.18)}
.cover{position:relative;background:var(--bg2);overflow:hidden;margin:8px 8px 0;border-radius:18px}
.feat .cover{aspect-ratio:5/4}
.cover img,.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .cover img{transform:scale(1.04)}
.cover video{opacity:0;transition:opacity .35s}
.cover.on video{opacity:1}
.tag{position:absolute;top:12px;right:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink);z-index:2}
.pl{position:absolute;left:12px;bottom:12px;z-index:2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pl svg{width:12px;height:12px;margin-left:2px}
.cinfo{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:16px 18px 4px}
.cinfo h3{font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.cinfo p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.bdg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px 18px}
.b{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:transparent}
.b.real{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.concept{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.b.mini{background:var(--bg2);border-color:transparent}

/* filters + grid */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 26px;font-size:13.5px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:flex;gap:22px;align-items:flex-start}
.gcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:22px}
.workbg{background:linear-gradient(180deg,var(--bg),var(--bg2) 14%,var(--bg2) 86%,var(--bg))}

/* about */
.about{overflow-x:clip}
.about .wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,6vw,80px);align-items:center}
.aph{position:relative;max-width:440px;margin-inline:auto;width:100%}
.aph .fr{border-radius:200px 200px 28px 28px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow);aspect-ratio:4/5}
.aph .fr img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.vc{position:absolute;right:-14%;bottom:-8%;width:34%;border-radius:20px;overflow:hidden;border:4px solid var(--surface);box-shadow:var(--shadow);background:#000;aspect-ratio:9/16;cursor:pointer}
.vc video{width:100%;height:100%;object-fit:cover}
.vc .pl{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.vc.play .pl{display:none}
.vcap{position:absolute;right:-14%;bottom:-16%;width:34%;font-size:11.5px;color:var(--muted);text-align:center}
.about p{margin:18px 0 0;color:var(--muted);max-width:56ch}
.about h2{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}

/* services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.sv{border-radius:26px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;min-height:270px;background:var(--t,var(--bg2))}
.sv:last-child:nth-child(4n+3){grid-column:span 2}
.sv:nth-child(4n+1){--t:#F9DCDD}.sv:nth-child(4n+2){--t:#FBE7E1}.sv:nth-child(4n+3){--t:#F6D3DA}.sv:nth-child(4n+4){--t:#FCEBE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sv:nth-child(n){--t:#3A262B}:root:not([data-theme="light"]) .sv:nth-child(even){--t:#33222A}}
:root[data-theme="dark"] .sv:nth-child(n){--t:#3A262B}
:root[data-theme="dark"] .sv:nth-child(even){--t:#33222A}
.sv .ic{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.sv .ic svg{width:22px;height:22px}
.sv h3{font-size:19px;font-weight:600;letter-spacing:-.015em}
.sv p{margin:0;font-size:14.5px;color:var(--muted)}
.sv .pr{margin-top:auto;font-size:13px;font-weight:600;color:var(--accent)}
.note{margin:26px 0 0;color:var(--muted);font-size:14.5px}

/* process */
.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.step{padding:26px 22px}
.step+.step{border-left:1px solid var(--line)}
.step i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:700;font-size:14px;margin-bottom:16px}
.step h3{font-size:17px;font-weight:600;margin-bottom:8px}
.step p{margin:0;font-size:14px;color:var(--muted)}

/* contact */
.cta{padding-block:0 clamp(48px,6vw,80px)}
.ctabox{background:linear-gradient(120deg,var(--bg3),var(--bg2) 55%,var(--accent-soft));border-radius:34px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;position:relative;overflow:hidden}
.ctabox h2{font-size:clamp(30px,4.6vw,56px)}
.ctabox h2 em{font-style:normal;color:var(--accent)}
.ctabox p{color:var(--muted);margin:18px 0 26px;max-width:46ch}
.links{display:grid;gap:10px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--glass);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:14px 18px;text-decoration:none;transition:transform .25s}
.lk:hover{transform:translateX(4px)}
.lk small{display:block;color:var(--muted);font-size:12px}
.lk b{font-weight:600;font-size:15px;word-break:break-word}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}

/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(48,24,30,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.ov.open{display:grid;place-items:center}
.dlg{position:relative;width:min(1180px,100%);height:min(780px,100%);background:var(--bg);border-radius:28px;display:grid;grid-template-columns:minmax(0,1fr) 340px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mst{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0;background:var(--bg2);padding:18px;gap:12px}
.stage{display:grid;place-items:center;min-height:0;min-width:0}
.stage img{width:100%;height:100%;object-fit:contain;border-radius:14px}
.stage video{width:100%;height:100%;object-fit:contain;border-radius:14px;background:#000}
.cap{text-align:center;font-size:13px;color:var(--muted);min-height:18px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.th{position:relative;flex:none;width:58px;height:58px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--bg3)}
.th img{width:100%;height:100%;object-fit:cover}
.th[aria-current="true"]{border-color:var(--accent)}
.th .pl{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:22px;height:22px}
.th .pl svg{width:8px;height:8px}
.info{padding:30px 26px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.info h3{font-size:24px;line-height:1.15;letter-spacing:-.02em}
.info .sub{color:var(--muted);margin:0;font-size:14.5px}
.info p.d{margin:0;font-size:15px}
.info dl{margin:0;display:grid;gap:6px}
.info dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--accent)}
.info dd{margin:0;font-size:14.5px}
.xl{display:grid;gap:8px;margin-top:4px}
.x{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.nv{position:absolute;top:calc(50% - 40px);z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transform:translateY(-50%)}
.nv.p{left:26px}.nv.n{right:26px}
.nv svg{width:16px;height:16px}
.nv[hidden]{display:none}

@media (max-width:1020px){
  .svc{grid-template-columns:repeat(2,1fr)}
  .sv:last-child:nth-child(4n+3){grid-column:1/-1}
  .proc{grid-template-columns:1fr}
  .step+.step{border-left:0;border-top:1px solid var(--line)}
  .ctabox{grid-template-columns:1fr}
}
@media (max-width:860px){
  .nav{display:none}
  .hero .wrap,.about .wrap{grid-template-columns:1fr}
  .portrait{max-width:380px;margin-top:16px}
  .portrait{margin-bottom:76px}
  .avail{right:4%;bottom:-76px;width:min(90%,330px)}
  .statbox{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .feat{grid-template-columns:1fr}
  .grid,.gcol{gap:14px}
  .card{border-radius:20px}
  .cinfo{padding:12px 12px 2px}
  .cinfo h3{font-size:15.5px}
  .cinfo p{font-size:13px}
  .bdg{padding:8px 12px 14px}
  .circ{width:28px;height:28px}
  .vc{right:2%;bottom:-6%}.vcap{display:none}
  .dlg{display:block;height:100%;overflow-y:auto}
  .mst{display:block;padding:12px 12px 8px}
  .mst>*+*{margin-top:10px}
  .stage{height:min(52vh,480px)}
  .nv{top:calc(12px + min(52vh,480px)/2 - 20px)}
  .nv.p{left:22px}.nv.n{right:22px}
  .info{overflow:visible;padding:22px 20px 28px}
  .x{position:fixed;top:calc(28px + env(safe-area-inset-top,0px));right:28px}
  .tools .lab{display:none}
}
@media (max-width:520px){
  .bar .wrap{gap:10px}
  .btn.sm{padding:9px 14px;font-size:13px}
  .svc{grid-template-columns:1fr}
  .sv{min-height:0}
  .hero .cta-row .btn{flex:1 1 auto;justify-content:center}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--gutter)*-1);padding-inline:var(--gutter);scrollbar-width:none}
  .chip{flex:none}
}
@media (prefers-reduced-motion:reduce){
  .track{animation:none}
  .rv,.card,.cover img,.btn{transition:none}
  html{scroll-behavior:auto}
}
</style>

<header class="bar" id="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Юлия Чуйкина">Ю<i>.</i>Ч</a>
    <nav class="nav" aria-label="Menu">

function card(p,big){

  return `<article class="card" tabindex="0" role="button" data-id="${p.id}" aria-label="${esc(T(p.title))}">

  gn=window.innerWidth<=860?2:3;
  const cols=Array.from({length:gn},()=>({h:0,html:''}));
  list.forEach(p=>{
    let c=cols[0];cols.forEach(x=>{if(x.h<c.h-0.001)c=x});
    c.html+=card(p,false);c.h+=1/Math.min(Math.max(p.ar,.66),1.78)+.42;
  });
  $('#grid').innerHTML=cols.map(c=>`<div class="gcol">${c.html}</div>`).join('');
}
window.addEventListener('resize',()=>{const n=window.innerWidth<=860?2:3;if(n!==gn)renderGrid()});
/* hover previews */
function hov(e,on){
  const c=e.target.closest&&e.target.closest('.card');if(!c||(e.pointerType&&e.pointerType!=='mouse'))return;
  const cv=c.querySelector('.cover'),v=c.querySelector('video');if(!v)return;
  if(on){if(!v.src)v.src=v.dataset.src;const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});cv.classList.add('on')}
  else{v.pause();cv.classList.remove('on')}
}
document.addEventListener('pointerover',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))hov(e,true)});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))hov(e,false)});
/* reveal */
let io=null;
function observe(){
  const els=document.querySelectorAll('.rv:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{rootMargin:'0px 0px -8% 0px'});
  els.forEach(e=>io.observe(e));
}
/* modal */
let cur=null,ix=0,lastFocus=null;
function openP(id){
  cur=D.find(p=>p.id===id);if(!cur)return;ix=0;lastFocus=document.activeElement;
  $('#ov').classList.add('open');document.body.classList.add('lock');
  renderInfo();renderItem();$('#mx').focus();
}
function closeP(){
  const v=$('#stage video');if(v)v.pause();
  $('#stage').innerHTML='';$('#ov').classList.remove('open');document.body.classList.remove('lock');
  if(lastFocus&&lastFocus.focus)lastFocus.focus();cur=null;
}
function renderInfo(){
  const p=cur;let h=`<div><span class="b ${p.badge}">${esc(T(BADGE[p.badge]))}</span></div><h3 id="mt">${esc(T(p.title))}</h3><p class="sub">${esc(T(p.sub))}</p><p class="d">${esc(T(p.desc))}</p>`;
  if(p.tools&&p.tools.length)h+=`<dl><dt>${esc(UI.m_tools[lang])}</dt><dd>${p.tools.map(esc).join(' · ')}</dd></dl>`;
  const cat=CATS.find(c=>c.k===p.cat);if(cat)h+=`<dl><dt>${esc(UI.m_cat[lang])}</dt><dd>${esc(cat[lang])}</dd></dl>`;
  if(p.links&&p.links.length)h+=`<div class="xl">${p.links.map(l=>`<a class="btn sec sm" href="${l.u}" target="_blank" rel="noopener">${esc(T(l.l))}${ARW.replace('<svg','<svg style="width:14px;height:14px"')}</a>`).join('')}</div>`;
  h+=`<div class="xl" style="margin-top:auto"><a class="btn pri sm" href="https://t.me/juliachu93" target="_blank" rel="noopener" style="justify-content:center">${esc(UI.cta_tg[lang])}</a></div>`;
  $('#info').innerHTML=h;
  $('#thumbs').innerHTML=p.media.map((m,i)=>`<button class="th" type="button" data-i="${i}" aria-label="${i+1}" aria-current="${i===ix}"><img src="${m.t==='v'?m.poster:m.src}" alt="" loading="lazy">${m.t==='v'?`<span class="pl">${PLAY}</span>`:''}</button>`).join('');
  const multi=p.media.length>1;$('#thumbs').hidden=!multi;$('#mp').hidden=!multi;$('#mn').hidden=!multi;
}
function renderItem(){
  const m=cur.media[ix],st=$('#stage');const old=st.querySelector('video');if(old)old.pause();
  if(m.t==='v'){
    st.innerHTML=`<video controls playsinline preload="metadata" poster="${m.poster}" src="${m.src}"${m.w?` style="max-width:${m.w}px"`:''}></video>`;
    const v=st.querySelector('video');const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});
  }else st.innerHTML=`<img src="${m.src}" alt="${esc(T(cur.title))}">`;
  $('#cap').textContent=m.label?T(m.label):(cur.media.length>1?`${ix+1} / ${cur.media.length}`:'');
  document.querySelectorAll('#thumbs .th').forEach((b,i)=>{b.setAttribute('aria-current',String(i===ix));if(i===ix)b.scrollIntoView({block:'nearest',inline:'center'})});
}
function go(d){if(!cur)return;ix=(ix+d+cur.media.length)%cur.media.length;renderItem()}
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(c){openP(c.dataset.id);return}
  const ch=e.target.closest('.chip');if(ch){filter=ch.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===ch)));renderGrid();return}
  const l=e.target.closest('.lang button');if(l){lang=l.dataset.l;try{localStorage.setItem('yc-lang',lang)}catch(x){}renderStatic();if(cur){renderInfo();renderItem()}return}
  const th=e.target.closest('.th');if(th){ix=+th.dataset.i;renderItem();return}
  if(e.target.id==='ov'||e.target.closest('#mx')){closeP();return}
  if(e.target.closest('#mp')){go(-1);return}
  if(e.target.closest('#mn')){go(1);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const c=e.target.closest&&e.target.closest('.card');if(c){e.preventDefault();openP(c.dataset.id);return}
    if(e.target.id==='vc'){e.preventDefault();vcToggle()}}
  if(!cur)return;
  if(e.key==='Escape')closeP();else if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
});
/* about video */
function vcToggle(){
  const w=$('#vc'),v=w.querySelector('video');
  if(v.paused){v.play().catch(()=>{});w.classList.add('play');v.controls=false}else{v.pause();w.classList.remove('play')}
}
$('#vc').addEventListener('click',vcToggle);
$('#vc video').addEventListener('ended',()=>$('#vc').classList.remove('play'));
/* header + parallax */
const bar=$('.bar'),blob=$('#blob');let tick=false;
const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function onScroll(){
  if(tick)return;tick=true;
  requestAnimationFrame(()=>{tick=false;const y=window.scrollY;bar.classList.toggle('scrolled',y>8);if(!rm&&blob)blob.style.transform=`translate3d(0,${Math.min(y,900)*.09}px,0)`});
}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
renderStatic();
</script>

</body></html>
